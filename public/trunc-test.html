<!doctype html>
<meta charset="utf-8">
<style>
  /* Replicate Tailwind semantics used in the collapsed card */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  .viewport { width: 375px; padding: 16px; border: 1px dashed #999; }
  /* Card: flex flex-row items-center gap-3 p-3 */
  .card { display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
  /* size-6 shrink-0 number badge */
  .num { display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 9999px; background: #eee; font-size: 12px; }
  /* size-8 shrink-0 icon */
  .icon { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; background: #dde; }
  /* min-w-0 flex-1  (NOT a flex container) */
  .mid { min-width: 0; flex: 1 1 0%; }
  /* line 133: flex items-center gap-2  (NO min-w-0) */
  .row { display: flex; align-items: center; gap: 8px; }
  /* truncate */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
  /* badge - inline-flex, natural size */
  .badge { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; background: #cfe8cf; border-radius: 9999px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #666; }
  /* cost shrink-0 */
  .cost { flex-shrink: 0; text-align: right; }
  /* Edit button shrink-0 */
  .edit { flex-shrink: 0; padding: 4px 8px; font-size: 14px; color: #666; white-space: nowrap; }
  .marker { color: red; font-size: 11px; }
</style>
<div class="viewport">
  <div class="card" id="card">
    <span class="num">3</span>
    <div class="icon">⚓</div>
    <div class="mid">
      <div class="row">
        <span class="truncate">Ocean freight from Shanghai to Los Angeles very long title indeed extremely</span>
        <span class="badge">● Booked</span>
      </div>
      <div class="sub">Shanghai → Los Angeles · Maersk Line</div>
    </div>
    <div class="cost"><div style="font-size:14px;font-weight:600;">$4,250</div><div style="font-size:11px;color:#666;">28 d</div></div>
    <div class="edit">Edit ▾</div>
  </div>
</div>
<pre id="out" class="marker"></pre>
<script>
  const card = document.getElementById('card');
  const out = document.getElementById('out');
  const rowEl = card.querySelector('.row');
  const trunc = card.querySelector('.truncate');
  const badge = card.querySelector('.badge');
  const cardRect = card.getBoundingClientRect();
  const rowRect = rowEl.getBoundingClientRect();
  const badgeRect = badge.getBoundingClientRect();
  out.textContent = JSON.stringify({
    cardScrollWidth: card.scrollWidth,
    cardClientWidth: card.clientWidth,
    cardOverflows: card.scrollWidth > card.clientWidth,
    rowScrollWidth: rowEl.scrollWidth,
    rowClientWidth: rowEl.clientWidth,
    rowOverflows: rowEl.scrollWidth > rowEl.clientWidth,
    truncClientWidth: trunc.clientWidth,
    truncScrollWidth: trunc.scrollWidth,
    truncIsEllipsized: trunc.scrollWidth > trunc.clientWidth,
    badgeRightEdge: Math.round(badgeRect.right),
    cardRightEdge: Math.round(cardRect.right),
    badgeWithinCard: badgeRect.right <= cardRect.right + 0.5
  }, null, 2);
</script>
